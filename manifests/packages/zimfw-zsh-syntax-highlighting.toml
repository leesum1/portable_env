id = "zimfw-zsh-syntax-highlighting"
description = "zsh syntax highlighting module"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "zsh-users/zsh-syntax-highlighting"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/zim/modules/zsh-syntax-highlighting"
strip_components = 1
