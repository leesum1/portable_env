id = "zimfw-git-info"
description = "zimfw git-info module"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "zimfw/git-info"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/zim/modules/git-info"
strip_components = 1
