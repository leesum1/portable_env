id = "zimfw-chrissicool-zsh-256color"
description = "zimfw zsh-256color module"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "chrissicool/zsh-256color"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/zim/modules/zsh-256color"
strip_components = 1
