id = "oh-my-zsh"
description = "oh-my-zsh framework for offline installation"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "ohmyzsh/ohmyzsh"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/oh-my-zsh"
strip_components = 1
