id = "zimfw-duration-info"
description = "zimfw duration-info module"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "zimfw/duration-info"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/zim/modules/duration-info"
strip_components = 1
