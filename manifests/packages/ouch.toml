id = "ouch"
description = "archive helper"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_release"
repo = "ouch-org/ouch"

[strategy]
type = "archive_extract"

[strategy.match]
x86_64 = '(?i)^ouch-x86_64-unknown-linux-musl\.tar\.gz$'
arm64 = '(?i)^ouch-aarch64-unknown-linux-musl\.tar\.gz$'

[strategy.extract]
include = ["ouch"]
target_dir = "bin"
