id = "zimfw-asciiship"
description = "zimfw asciiship theme"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "zimfw/asciiship"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/zim/modules/asciiship"
strip_components = 1
