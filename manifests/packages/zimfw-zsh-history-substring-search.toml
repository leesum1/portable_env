id = "zimfw-zsh-history-substring-search"
description = "zsh history substring search module"
profiles = ["extended"]
architectures = ["x86_64", "arm64"]

[source]
type = "github_archive"
repo = "zsh-users/zsh-history-substring-search"
ref = "master"

[strategy]
type = "archive_tree"

[strategy.extract]
target_dir = "cache/zim/modules/zsh-history-substring-search"
strip_components = 1
