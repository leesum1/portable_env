name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with [toolchains] in manifests/manifest.toml and with the ARGs
  # in docker/builder-full.Dockerfile.
  RUST_VERSION: "1.99.1"
  CARGO_ZIGBUILD_VERSION: "0.24.0"
  ZIG_VERSION: "0.16.0"
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q
      - run: python -m red_env manifest lint --manifest-root manifests

  build-x86_64:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Rust toolchain with musl targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          rustup default "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
      - name: Install Zig
        run: |
          zig_arch="x86_64"
          zig_sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${zig_sha}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - run: python -m pip install -e .[dev]
      - run: mkdir -p "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/dist"
      - run: python -m red_env build --profile core --arch x86_64 --manifest-root "$GITHUB_WORKSPACE/manifests" --build-root "$GITHUB_WORKSPACE/build" --dist-root "$GITHUB_WORKSPACE/dist" --cache-root "$GITHUB_WORKSPACE/build/cache"
        working-directory: /tmp
      - run: python -m red_env verify --artifact "$GITHUB_WORKSPACE/dist/red_env_core_x86_64.tar.gz" --arch x86_64 --dockerfile "$GITHUB_WORKSPACE/docker/verifier.Dockerfile"
        working-directory: /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: red_env_core_x86_64
          path: |
            ${{ github.workspace }}/dist/red_env_core_x86_64.tar.gz
            ${{ github.workspace }}/dist/red_env_core_x86_64.tar.gz.sha256
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-22.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Rust toolchain with musl targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          rustup default "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
      - name: Install Zig
        run: |
          zig_arch="aarch64"
          zig_sha="ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${zig_sha}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - run: python -m pip install -e .[dev]
      - run: mkdir -p "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/dist"
      - run: python -m red_env build --profile core --arch arm64 --manifest-root "$GITHUB_WORKSPACE/manifests" --build-root "$GITHUB_WORKSPACE/build" --dist-root "$GITHUB_WORKSPACE/dist" --cache-root "$GITHUB_WORKSPACE/build/cache"
        working-directory: /tmp
      - run: python -m red_env verify --artifact "$GITHUB_WORKSPACE/dist/red_env_core_arm64.tar.gz" --arch arm64 --dockerfile "$GITHUB_WORKSPACE/docker/verifier.Dockerfile"
        working-directory: /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: red_env_core_arm64
          path: |
            ${{ github.workspace }}/dist/red_env_core_arm64.tar.gz
            ${{ github.workspace }}/dist/red_env_core_arm64.tar.gz.sha256
          if-no-files-found: error

  builder-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hermetic builder image
        run: docker build --file docker/builder-full.Dockerfile --tag red-env-builder:full docker/
      - name: Smoke test toolchain versions
        run: |
          docker run --rm red-env-builder:full sh -c 'rustc --version && go version && zig version && cargo zigbuild --help > /dev/null'

  release:
    needs: [test, build-x86_64, build-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: red_env_core_*
          merge-multiple: true
          path: dist
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/red_env_core_x86_64.tar.gz
            dist/red_env_core_x86_64.tar.gz.sha256
            dist/red_env_core_arm64.tar.gz
            dist/red_env_core_arm64.tar.gz.sha256
