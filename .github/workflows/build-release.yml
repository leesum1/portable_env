name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: mkdir -p dist
      - run: python -m red_env manifest lint
      - run: python -m red_env build --profile core --arch x86_64
      - run: python -m red_env verify --artifact dist/red_env_core_x86_64.tar.gz --arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: red_env_core_x86_64
          path: |
            dist/red_env_core_x86_64.tar.gz
            dist/red_env_core_x86_64.tar.gz.sha256
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: mkdir -p dist
      - run: python -m red_env manifest lint
      - run: python -m red_env build --profile core --arch arm64
      - run: python -m red_env verify --artifact dist/red_env_core_arm64.tar.gz --arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: red_env_core_arm64
          path: |
            dist/red_env_core_arm64.tar.gz
            dist/red_env_core_arm64.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [build-x86_64, build-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: red_env_core_*
          merge-multiple: true
          path: dist
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/red_env_core_x86_64.tar.gz
            dist/red_env_core_x86_64.tar.gz.sha256
            dist/red_env_core_arm64.tar.gz
            dist/red_env_core_arm64.tar.gz.sha256
